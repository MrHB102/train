<script type="module">
import { Stage } from '/scene.js';
window.__ready = false;
window.initStage = async (shotUrl, opts) => {
  const shot = await (await fetch(shotUrl)).json();
  window.stage = new Stage(shot, opts || {});
  window.__ready = true;
  return { frames: shot.frames, w: window.stage.W, h: window.stage.H };
};
window.renderFrame = (i, pass) => window.stage.render(i, pass || 'color');
